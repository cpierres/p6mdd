server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: gateway
  cloud:
    gateway:
      default-filters:
        # Évite les doublons de headers CORS lorsque le service en aval ajoute aussi les headers.
        # Sans cela, le navigateur peut bloquer avec :
        # "Access-Control-Allow-Origin header contains multiple values ..."
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - ${P6_FRONTEND_URL:http://localhost:4200}
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type
              - Cookie
            exposedHeaders:
              - Set-Cookie
            allowCredentials: true
      routes:
        # Auth
        - id: auth-service
          uri: ${P6_AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**

        # API "métier" (topics/posts/...)
        - id: back
          uri: ${P6_BACK_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/**

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.cloud.gateway: INFO
