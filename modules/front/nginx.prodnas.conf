server {
    listen 80;

    server_name localhost mdd.cpierres.dscloud.me nascpi8;

    # Servir les fichiers statiques (Frontend Angular)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html; # Gestion des routes Angular
    }

    # Proxy vers le backend
    location /api/ {
        proxy_pass http://backend:8080/api/; # adresse interne (docker) du backend
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Configuration des timeouts pour les connexions SSE
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 3600s;
    }

    # Préparation du routage vers l'auth-service (externalisation de l'auth)
    # Décommentez ces blocs lorsque l'auth-service sera déployé
    # location /api/auth/ {
    #     proxy_pass http://auth-service:8081/api/auth/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection 'upgrade';
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_cache_bypass $http_upgrade;
    # }

    # location /oauth2/ {
    #     proxy_pass http://auth-service:8081/oauth2/;
    # }

    # location /login/oauth2/ {
    #     proxy_pass http://auth-service:8081/login/oauth2/;
    # }

  # Configuration pour HTTPS
  location /swagger-ui/ {
      proxy_pass http://backend:8080/swagger-ui/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;  # Important pour HTTPS
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;     # Port HTTPS
      proxy_set_header X-Forwarded-Ssl on;       # Indique SSL actif

      # Configuration pour les WebSockets si nécessaire
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      # Timeout settings
      proxy_connect_timeout 60s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
  }

  location /v3/api-docs {
      proxy_pass http://backend:8080/v3/api-docs;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;  # Important pour HTTPS
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;     # Port HTTPS
      proxy_set_header X-Forwarded-Ssl on;       # Indique SSL actif
  }

  # Publication des clés publiques JWT (JWK Set) par l'auth-service
  # location /.well-known/jwks.json {
  #     proxy_pass http://auth-service:8081/.well-known/jwks.json;
  # }

}
