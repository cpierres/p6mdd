<mat-card class="post-card" (click)="selectPost()">
  <mat-card-header>
    <mat-card-title>{{ post.title }}</mat-card-title>
    <mat-card-subtitle>
      <div class="post-metadata">
        <span>{{ post.updatedAt | date:'dd/MM/yyyy HH:mm' }}</span>
        <span>{{ post.createdByUsername }}</span>
        <span>{{ post.topicTitle }}</span>
      </div>
    </mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <div [class.overflow-content]="overflowPoints" class="post-content">
      {{ post.content }}
    </div>
  </mat-card-content>
</mat-card>
