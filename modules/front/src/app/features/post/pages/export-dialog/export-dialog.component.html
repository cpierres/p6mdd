<h2 mat-dialog-title>Exporter les posts</h2>
<div mat-dialog-content>
  <mat-form-field appearance="fill" style="width: 100%;">
    <mat-label>Nom du fichier</mat-label>
    <input matInput [(ngModel)]="data.filename">
    <mat-hint>Le fichier sera enregistré dans resources/demo-data</mat-hint>
  </mat-form-field>
</div>
<div mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Annuler</button>
  <button mat-raised-button color="primary" (click)="onConfirm()">Exporter</button>
</div>
