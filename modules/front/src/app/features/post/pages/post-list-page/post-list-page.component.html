<div class="post-list-container">
  <div class="post-list-header">
    <button mat-raised-button color="primary" (click)="openCreatePost()">
      Créer un article
    </button>
    <div class="filter-sort-controls">
      <mat-form-field appearance="outline" class="custom-select">
        <mat-label>Filtrer par thème</mat-label>
        <mat-select [(ngModel)]="selectedTopicId" (selectionChange)="onTopicFilterChange()" panelClass="theme-filter-panel">
          <mat-option [value]="'subscribed'">Mes thèmes</mat-option>
          <mat-option [value]="'all'">Tous les thèmes</mat-option>
          <mat-option *ngFor="let topic of topics" [value]="topic.id">
            {{ topic.title }} ({{ topic.countPosts }} articles - {{ topic.countComments }} commentaires)
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Trier par</mat-label>
        <mat-select [(ngModel)]="sortCriteria" (selectionChange)="onSortChange()">
          <mat-option value="date">Date (récent d'abord)</mat-option>
          <mat-option value="topic">Thème</mat-option>
          <mat-option value="author">Auteur</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </div>
  <mat-grid-list [cols]="cols" [gutterSize]="'8px'" rowHeight="16:9" >
    <mat-grid-tile *ngFor="let post of posts">
      <app-post-list
        [post]="post"
        [overflowPoints]="true"
        (onSelect)="onSelectPost($event)">
      </app-post-list>
    </mat-grid-tile>
  </mat-grid-list>

</div>
